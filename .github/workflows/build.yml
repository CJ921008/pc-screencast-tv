name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build Android TV app
        working-directory: android-tv
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: LANScreenCast-Android-TV-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build WinUI app
        shell: pwsh
        run: msbuild windows/LANScreenCast.sln /restore /m /p:Configuration=Debug /p:Platform=x64 /p:GenerateAppxPackageOnBuild=false /p:AppxPackageSigningEnabled=false
      - name: Upload Windows build output
        uses: actions/upload-artifact@v4
        with:
          name: LANScreenCast-Windows-x64-debug
          path: windows/x64/Debug/LANScreenCast/
          if-no-files-found: error
