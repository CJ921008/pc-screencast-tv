name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build Android TV app
        working-directory: android-tv
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: LANScreenCast-Android-TV-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Prepare pinned vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git .vcpkg
          git -C .vcpkg checkout 2750401336fb7c95f6619657a46a7e798661341c
          & ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
          New-Item -ItemType Directory -Force .vcpkg-bincache | Out-Null
      - uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: |
            .vcpkg-bincache
            .vcpkg/downloads
          key: windows-vcpkg-${{ hashFiles('windows/vcpkg.json') }}
      - name: Install native media dependencies
        shell: pwsh
        run: |
          & ./.vcpkg/vcpkg.exe install --x-manifest-root=windows --x-install-root=windows/vcpkg_installed --triplet=x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg dependency build failed' }
      - uses: actions/cache/save@v4
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .vcpkg-bincache
            .vcpkg/downloads
          key: windows-vcpkg-${{ hashFiles('windows/vcpkg.json') }}
      - name: Build Release MSIX
        shell: pwsh
        run: msbuild windows/LANScreenCast.sln /restore /m /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never
      - name: Test software H264 and WebRTC loopback
        shell: pwsh
        run: |
          Install-WindowsFeature Server-Media-Foundation
          cmake -S windows/tests -B windows/tests/build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/windows/vcpkg_installed" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DVCPKG_MANIFEST_MODE=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Native test configuration failed' }
          cmake --build windows/tests/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Native test build failed' }
          ctest --test-dir windows/tests/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native media tests failed' }
      - name: Sign test package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem windows -Recurse -File -Filter '*.msix')
          if ($packages.Count -ne 1) { throw "Expected one MSIX; found $($packages.Count)" }
          $output = Join-Path $env:GITHUB_WORKSPACE 'windows-package'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $msix = Join-Path $output 'LANScreenCast-x64.msix'
          Copy-Item $packages[0].FullName $msix
          $dependencies = Join-Path $packages[0].DirectoryName 'Dependencies\x64'
          if (-not (Test-Path $dependencies)) { throw 'MSIX framework dependencies not found' }
          Copy-Item (Join-Path $packages[0].DirectoryName 'Dependencies') -Destination $output -Recurse
          if (@(Get-ChildItem (Join-Path $output 'Dependencies\x64') -Filter '*.appx').Count -lt 2) { throw 'Expected VCLibs dependency packages' }

          $cert = New-SelfSignedCertificate -Type Custom -KeyUsage DigitalSignature -Subject 'CN=LAN ScreenCast' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') -FriendlyName 'LAN ScreenCast test package'
          Export-Certificate -Cert $cert -FilePath (Join-Path $output 'LANScreenCast-Test.cer') | Out-Null

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'SignTool not found' }
          & $signTool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My $msix
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed: $LASTEXITCODE" }
          Import-Certificate -FilePath (Join-Path $output 'LANScreenCast-Test.cer') -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          & $signTool.FullName verify /pa /v $msix
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $LASTEXITCODE" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LANScreenCast-Windows-x64-MSIX
          path: windows-package/
          if-no-files-found: error
